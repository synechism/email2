services:
  postgres:
    image: postgres:16
    container_name: email-thread-scraper-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_scraper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
